<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>web 实时通知测试</title>
</head>
<body>
    <h1>实时通知测试</h1>
    
    <button id="sendButton">点击发送测试消息给后端</button>
    <p>状态：<span id="status">等待连接...</span></p>

    <input id="input" type="text" placeholder="请输入文本">
    <button id="send">芜湖！</button>
    
    <h2>接收到的通知：</h2>
    <div id="notifications"></div>



    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
